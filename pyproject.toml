[project]
name = "compphys"
version = "0.1.0"
description = "Interactive marimo notebooks: solving PDEs with finite differences and nodal discontinuous Galerkin methods"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.0",
    "matplotlib>=3.11.2",
    "mograder>=0.3.3",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]
